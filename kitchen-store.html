<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Rasoi Basket — Daily Kitchen Essentials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7EE;
    --panel:#FFFFFF;
    --charcoal:#2A2420;
    --mustard:#D8A02A;
    --mustard-dark:#B37F1B;
    --leaf:#3C5B45;
    --leaf-dark:#2A4432;
    --brick:#B5482D;
    --line:#E7DFCE;
    --muted:#8A7F6C;
    --radius-card: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--charcoal);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Zilla Slab',serif;
    font-weight:600;
    margin:0;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- Header ---------- */
  .topbar{
    background:var(--leaf);
    color:#fff;
    padding:16px 18px 20px;
    position:sticky; top:0; z-index:30;
    border-bottom:3px solid var(--mustard);
  }
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .store-name{font-size:22px; letter-spacing:0.2px;}
  .store-tag{font-size:12.5px; color:#D8E5DA; margin-top:2px;}
  .nav-toggle{
    display:flex; background:rgba(255,255,255,0.14); border-radius:999px; padding:3px; gap:2px;
  }
  .nav-toggle button{
    border:none; background:transparent; color:#EDEDE6; font-size:13px; font-weight:600;
    padding:7px 14px; border-radius:999px;
  }
  .nav-toggle button.active{background:var(--mustard); color:#2A2420;}

  .container{max-width:720px; margin:0 auto; padding:16px 14px 120px;}

  /* ---------- Category chips ---------- */
  .chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 14px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:8px 15px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--panel); font-size:13.5px; font-weight:600; color:var(--charcoal); white-space:nowrap;
  }
  .chip.active{background:var(--charcoal); color:#fff; border-color:var(--charcoal);}

  /* ---------- Product grid ---------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-card);
    padding:12px; display:flex; flex-direction:column; gap:8px;
  }
  .card-thumb{
    width:100%; aspect-ratio:1/1; border-radius:10px; background:#F1EADA;
    display:flex; align-items:center; justify-content:center; font-size:34px; overflow:hidden;
  }
  .card-thumb img{width:100%; height:100%; object-fit:cover;}
  .card-name{font-size:14.5px; font-weight:600; line-height:1.25;}
  .card-unit{font-size:12px; color:var(--muted);}
  .card-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .card-price{font-family:'Zilla Slab',serif; font-weight:700; font-size:16.5px; color:var(--leaf-dark);}
  .qty-add{
    background:var(--leaf); color:#fff; border:none; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600;
  }
  .qty-stepper{display:flex; align-items:center; gap:8px; background:var(--leaf); border-radius:8px; padding:4px 6px;}
  .qty-stepper button{background:none; border:none; color:#fff; font-size:16px; width:20px; font-weight:700;}
  .qty-stepper span{color:#fff; font-size:13.5px; font-weight:700; min-width:14px; text-align:center;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--muted);
  }

  /* ---------- Cart bar ---------- */
  .cart-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    max-width:720px; margin:0 auto;
    background:var(--charcoal); color:#fff;
    padding:13px 16px; display:flex; align-items:center; justify-content:space-between;
    border-radius:16px 16px 0 0; box-shadow:0 -6px 18px rgba(0,0,0,0.15);
  }
  .cart-bar-left{font-size:13px; color:#D8CFB8;}
  .cart-bar-total{font-family:'Zilla Slab',serif; font-size:18px; font-weight:700; color:#fff;}
  .cart-bar-btn{background:var(--mustard); color:#2A2420; border:none; padding:10px 18px; border-radius:9px; font-weight:700; font-size:14px;}

  /* ---------- Sheet / modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,16,10,0.5); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--cream); width:100%; max-width:720px; border-radius:20px 20px 0 0;
    max-height:88vh; overflow-y:auto; padding:20px 18px 26px;
  }
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-close{background:none; border:none; font-size:22px; color:var(--muted); line-height:1;}

  .cart-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .cart-row-name{flex:1; font-size:14px; font-weight:600;}
  .cart-row-sub{font-size:12px; color:var(--muted);}
  .cart-row-price{font-family:'Zilla Slab',serif; font-weight:700; font-size:14px; width:64px; text-align:right;}
  .remove-x{background:none;border:none;color:var(--brick);font-size:18px;padding:0 2px;}

  .totals-row{display:flex; justify-content:space-between; padding:6px 0; font-size:14px;}
  .totals-row.grand{font-weight:700; font-size:16.5px; border-top:1.5px dashed var(--line); margin-top:8px; padding-top:12px;}

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:5px;}
  .field input, .field textarea{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:14.5px; background:#fff;
  }
  .field textarea{resize:vertical; min-height:56px;}

  .btn-primary{
    width:100%; background:var(--leaf); color:#fff; border:none; padding:13px; border-radius:10px;
    font-weight:700; font-size:15px; margin-top:6px;
  }
  .btn-secondary{
    width:100%; background:var(--panel); border:1.5px solid var(--charcoal); color:var(--charcoal);
    padding:13px; border-radius:10px; font-weight:700; font-size:15px; margin-top:10px;
  }
  .btn-upi{
    width:100%; background:#12805C; color:#fff; border:none; padding:13px; border-radius:10px; font-weight:700; font-size:15px; margin-top:10px;
  }

  .confirm-icon{font-size:44px; text-align:center; margin-bottom:6px;}
  .confirm-title{text-align:center; font-size:19px; margin-bottom:4px;}
  .confirm-sub{text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:18px;}
  .order-id-pill{
    text-align:center; font-family:'Zilla Slab',serif; font-weight:700; background:#F1EADA;
    border-radius:8px; padding:8px; margin-bottom:14px; letter-spacing:0.5px;
  }

  /* ---------- Admin ---------- */
  .admin-tabs{display:flex; gap:6px; margin-bottom:16px;}
  .admin-tab{flex:1; padding:9px; text-align:center; border-radius:9px; background:var(--panel); border:1.5px solid var(--line); font-size:13px; font-weight:700; color:var(--muted);}
  .admin-tab.active{background:var(--charcoal); color:#fff; border-color:var(--charcoal);}

  .admin-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px;}
  .prod-row{display:flex; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:10px; margin-bottom:9px;}
  .prod-row-thumb{width:44px; height:44px; border-radius:8px; background:#F1EADA; display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden; flex:0 0 auto;}
  .prod-row-thumb img{width:100%; height:100%; object-fit:cover;}
  .prod-row-info{flex:1; min-width:0;}
  .prod-row-info .n{font-size:13.5px; font-weight:600;}
  .prod-row-info .p{font-size:12px; color:var(--muted);}
  .icon-btn{background:none; border:none; font-size:16px; padding:6px;}

  .order-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px; margin-bottom:10px;}
  .order-card-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .order-status{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:#FBEBD7; color:var(--mustard-dark);}
  .order-status.done{background:#E1EEE3; color:var(--leaf-dark);}
  .order-items{font-size:12.5px; color:var(--muted); margin:4px 0;}
  .order-actions{display:flex; gap:8px; margin-top:8px;}
  .order-actions button{flex:1; padding:8px; border-radius:8px; font-size:12.5px; font-weight:700; border:1.5px solid var(--line); background:#fff;}

  .lock-screen{max-width:340px; margin:60px auto; text-align:center;}
  .lock-screen input{text-align:center; font-size:20px; letter-spacing:6px;}

  .small-btn{background:var(--leaf); color:#fff; border:none; padding:9px 14px; border-radius:8px; font-size:13px; font-weight:700;}
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--charcoal); color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  .muted-note{font-size:12px; color:var(--muted); line-height:1.5; margin-top:4px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <div class="store-name display" id="storeNameDisplay">Rasoi Basket</div>
      <div class="store-tag" id="storeTagDisplay">Fresh kitchen essentials, delivered daily</div>
    </div>
    <div class="nav-toggle" id="navToggleWrap"></div>
  </div>
</div>

<div class="container" id="app"></div>

<div id="toast" class="toast"></div>

<script>
/* ---------------- Storage helpers ---------------- */
async function sget(key, fallback){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : fallback; }
  catch(e){ return fallback; }
}
async function sset(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), true); }catch(e){ console.error('storage set failed', e); }
}

/* ---------------- State ---------------- */
let settings = { storeName:"Rasoi Basket", tagline:"Fresh kitchen essentials, delivered daily", whatsapp:"", upi:"", payeeName:"Rasoi Basket", pin:"1234" };
let products = [];
let orders = [];
let cart = {}; // id -> qty
const params = new URLSearchParams(window.location.search);
const MODE = params.get('owner') === '1' ? 'owner' : 'shop';
let view = MODE === 'owner' ? 'admin' : 'shop';
let activeCategory = "All";
let adminTab = "products";
let adminUnlocked = false;
const hiddenPhotoInput = document.createElement('input');
hiddenPhotoInput.type = 'file'; hiddenPhotoInput.accept = 'image/*'; hiddenPhotoInput.style.display='none';
document.body.appendChild(hiddenPhotoInput);

const seedProducts = [
  { id: cryptoId(), name:"Toor Dal (Arhar)", unit:"1 kg", price:150, category:"Pulses & Grains", emoji:"🫘" },
  { id: cryptoId(), name:"Basmati Rice", unit:"1 kg", price:120, category:"Pulses & Grains", emoji:"🍚" },
  { id: cryptoId(), name:"Sunflower Oil", unit:"1 L", price:135, category:"Oil & Ghee", emoji:"🫗" },
  { id: cryptoId(), name:"Amul Ghee", unit:"500 ml", price:320, category:"Oil & Ghee", emoji:"🧈" },
  { id: cryptoId(), name:"Onion", unit:"1 kg", price:35, category:"Vegetables", emoji:"🧅" },
  { id: cryptoId(), name:"Tomato", unit:"1 kg", price:40, category:"Vegetables", emoji:"🍅" },
  { id: cryptoId(), name:"Potato", unit:"1 kg", price:28, category:"Vegetables", emoji:"🥔" },
  { id: cryptoId(), name:"Turmeric Powder", unit:"200 g", price:45, category:"Spices", emoji:"🟡" },
  { id: cryptoId(), name:"Red Chilli Powder", unit:"200 g", price:55, category:"Spices", emoji:"🌶️" },
  { id: cryptoId(), name:"Milk", unit:"1 L", price:32, category:"Dairy", emoji:"🥛" },
  { id: cryptoId(), name:"Curd", unit:"400 g", price:35, category:"Dairy", emoji:"🍶" },
  { id: cryptoId(), name:"Bread", unit:"1 pack", price:45, category:"Bakery", emoji:"🍞" },
];

function cryptoId(){ return 'p' + Math.random().toString(36).slice(2,10); }
function orderId(){ return 'RB' + Date.now().toString().slice(-8); }
function money(n){ return '₹' + Number(n).toFixed(0); }
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- Init ---------------- */
async function init(){
  settings = await sget('settings', settings);
  products = await sget('products', null);
  if(!products){ products = seedProducts; await sset('products', products); }
  orders = await sget('orders', []);
  document.getElementById('storeNameDisplay').textContent = settings.storeName;
  document.getElementById('storeTagDisplay').textContent = settings.tagline;
  setupNav();
  render();
}

function setupNav(){
  const wrap = document.getElementById('navToggleWrap');
  if(MODE !== 'owner'){ wrap.innerHTML=''; return; } // customer link: no owner option, ever
  wrap.innerHTML = `<button id="navShop">Shop preview</button><button id="navAdmin">Owner</button>`;
  document.getElementById('navShop').onclick = ()=>{ view='shop'; setNav(); render(); };
  document.getElementById('navAdmin').onclick = ()=>{ view='admin'; setNav(); render(); };
  setNav();
}
function setNav(){
  const s=document.getElementById('navShop'), a=document.getElementById('navAdmin');
  if(!s||!a) return;
  s.classList.toggle('active', view==='shop');
  a.classList.toggle('active', view==='admin');
}

/* ---------------- Render root ---------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = view==='shop' ? renderShop() : renderAdmin();
  attachShopEvents();
  attachAdminEvents();
}

/* ================= SHOP VIEW ================= */
function renderShop(){
  const cats = ["All", ...Array.from(new Set(products.map(p=>p.category)))];
  const list = products.filter(p => activeCategory==="All" || p.category===activeCategory);

  const chips = cats.map(c => `<button class="chip ${c===activeCategory?'active':''}" data-cat="${escapeAttr(c)}">${c}</button>`).join('');

  const cards = list.length ? list.map(p=>{
    const qty = cart[p.id] || 0;
    return `
    <div class="card">
      <div class="card-thumb">${p.image ? `<img src="${escapeAttr(p.image)}" alt="">` : p.emoji||'🛒'}</div>
      <div class="card-name">${escapeHtml(p.name)}</div>
      <div class="card-unit">${escapeHtml(p.unit)}</div>
      <div class="card-bottom">
        <div class="card-price">${money(p.price)}</div>
        ${qty>0
          ? `<div class="qty-stepper">
               <button data-dec="${p.id}">−</button>
               <span>${qty}</span>
               <button data-inc="${p.id}">+</button>
             </div>`
          : `<button class="qty-add" data-inc="${p.id}">Add</button>`
        }
      </div>
    </div>`;
  }).join('') : `<div class="empty" style="grid-column:1/-1;">No items in this category yet.</div>`;

  const cartCount = Object.values(cart).reduce((a,b)=>a+b,0);
  const cartTotal = Object.entries(cart).reduce((sum,[id,q])=>{
    const p = products.find(x=>x.id===id); return sum + (p?p.price*q:0);
  },0);

  return `
    <div class="chips">${chips}</div>
    <div class="grid">${cards}</div>
    ${cartCount>0 ? `
    <div class="cart-bar" id="openCartBtn">
      <div>
        <div class="cart-bar-left">${cartCount} item${cartCount>1?'s':''}</div>
        <div class="cart-bar-total">${money(cartTotal)}</div>
      </div>
      <button class="cart-bar-btn">View cart</button>
    </div>` : ''}
  `;
}

function attachShopEvents(){
  document.querySelectorAll('[data-cat]').forEach(el=>{
    el.onclick = ()=>{ activeCategory = el.dataset.cat; render(); };
  });
  document.querySelectorAll('[data-inc]').forEach(el=>{
    el.onclick = ()=>{ const id=el.dataset.inc; cart[id]=(cart[id]||0)+1; render(); };
  });
  document.querySelectorAll('[data-dec]').forEach(el=>{
    el.onclick = ()=>{ const id=el.dataset.dec; cart[id]=(cart[id]||0)-1; if(cart[id]<=0) delete cart[id]; render(); };
  });
  const openCart = document.getElementById('openCartBtn');
  if(openCart) openCart.onclick = openCartSheet;
}

/* ---------------- Cart sheet ---------------- */
function openCartSheet(){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `<div class="sheet">${cartSheetHtml()}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  wireCartSheet(overlay);
}

function cartSheetHtml(){
  const rows = Object.entries(cart).map(([id,q])=>{
    const p = products.find(x=>x.id===id);
    if(!p) return '';
    return `
    <div class="cart-row">
      <div style="flex:1;">
        <div class="cart-row-name">${escapeHtml(p.name)}</div>
        <div class="cart-row-sub">${q} × ${money(p.price)} · ${escapeHtml(p.unit)}</div>
      </div>
      <div class="cart-row-price">${money(p.price*q)}</div>
      <button class="remove-x" data-remove="${id}">×</button>
    </div>`;
  }).join('');
  const total = Object.entries(cart).reduce((sum,[id,q])=>{
    const p = products.find(x=>x.id===id); return sum + (p?p.price*q:0);
  },0);

  return `
    <div class="sheet-head"><h3>Your cart</h3><button class="sheet-close" data-close>×</button></div>
    ${rows || '<div class="empty">Cart is empty</div>'}
    <div class="totals-row grand"><span>Total</span><span>${money(total)}</span></div>
    <button class="btn-primary" id="goCheckout" ${total===0?'disabled style="opacity:.5"':''}>Proceed to checkout</button>
  `;
}

function wireCartSheet(overlay){
  overlay.querySelector('[data-close]').onclick = ()=>overlay.remove();
  overlay.querySelectorAll('[data-remove]').forEach(el=>{
    el.onclick = ()=>{ delete cart[el.dataset.remove]; overlay.querySelector('.sheet').innerHTML = cartSheetHtml(); wireCartSheet(overlay); render(); };
  });
  const go = overlay.querySelector('#goCheckout');
  if(go) go.onclick = ()=>{ overlay.remove(); openCheckoutSheet(); };
}

/* ---------------- Checkout sheet ---------------- */
function openCheckoutSheet(){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `<div class="sheet">
    <div class="sheet-head"><h3>Delivery details</h3><button class="sheet-close" data-close>×</button></div>
    <div class="field"><label>Your name</label><input id="cName" placeholder="e.g. Priya Sharma"></div>
    <div class="field"><label>Phone number</label><input id="cPhone" type="tel" placeholder="10-digit mobile number"></div>
    <div class="field"><label>Delivery address</label><textarea id="cAddr" placeholder="House no, street, area, landmark"></textarea></div>
    <div class="field"><label>Notes (optional)</label><textarea id="cNotes" placeholder="e.g. deliver after 6 PM"></textarea></div>
    <button class="btn-primary" id="placeOrderBtn">Place order</button>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('[data-close]').onclick = ()=>overlay.remove();
  overlay.querySelector('#placeOrderBtn').onclick = async ()=>{
    const name = overlay.querySelector('#cName').value.trim();
    const phone = overlay.querySelector('#cPhone').value.trim();
    const addr = overlay.querySelector('#cAddr').value.trim();
    const notes = overlay.querySelector('#cNotes').value.trim();
    if(!name || !phone || !addr){ showToast('Please fill name, phone and address'); return; }
    const items = Object.entries(cart).map(([id,q])=>{
      const p = products.find(x=>x.id===id);
      return { name:p.name, unit:p.unit, price:p.price, qty:q };
    });
    const total = items.reduce((s,i)=>s+i.price*i.qty,0);
    const order = { id: orderId(), name, phone, addr, notes, items, total, status:'pending', time: new Date().toLocaleString('en-IN') };
    orders = await sget('orders', []);
    orders.unshift(order);
    await sset('orders', orders);
    cart = {};
    overlay.remove();
    render();
    openConfirmSheet(order);
  };
}

/* ---------------- Confirmation + payment sheet ---------------- */
function openConfirmSheet(order){
  const upiLink = buildUpiLink(order);
  const waLink = buildWhatsappLink(order);
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `<div class="sheet">
    <div class="confirm-icon">🧾</div>
    <div class="confirm-title display">Order placed!</div>
    <div class="confirm-sub">Complete payment and notify the store below.</div>
    <div class="order-id-pill">${order.id} · ${money(order.total)}</div>
    ${settings.upi ? `<a class="btn-upi" style="display:block;text-align:center;text-decoration:none;" href="${upiLink}">Pay ${money(order.total)} via UPI</a>` : `<div class="muted-note">Store hasn't set up a UPI ID yet — pay via cash on delivery.</div>`}
    ${settings.whatsapp ? `<a class="btn-secondary" style="display:block;text-align:center;text-decoration:none;" href="${waLink}" target="_blank">Send order to store on WhatsApp</a>` : `<div class="muted-note" style="margin-top:8px;">Store hasn't added a WhatsApp number yet.</div>`}
    <button class="btn-secondary" data-close>Done</button>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('[data-close]').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}

function buildUpiLink(order){
  const note = encodeURIComponent(`${settings.storeName} order ${order.id}`);
  const payee = encodeURIComponent(settings.payeeName || settings.storeName);
  return `upi://pay?pa=${encodeURIComponent(settings.upi)}&pn=${payee}&am=${order.total}&cu=INR&tn=${note}`;
}
function buildWhatsappLink(order){
  const lines = order.items.map(i=>`• ${i.name} (${i.unit}) x${i.qty} = ${money(i.price*i.qty)}`).join('%0A');
  const msg = `New order ${order.id}%0A%0AName: ${encodeURIComponent(order.name)}%0APhone: ${encodeURIComponent(order.phone)}%0AAddress: ${encodeURIComponent(order.addr)}%0A${order.notes ? 'Notes: '+encodeURIComponent(order.notes)+'%0A' : ''}%0AItems:%0A${lines}%0A%0ATotal: ${money(order.total)}`;
  const phone = settings.whatsapp.replace(/[^0-9]/g,'');
  return `https://wa.me/${phone}?text=${msg}`;
}

/* ================= ADMIN VIEW ================= */
function renderAdmin(){
  if(!adminUnlocked){
    return `
    <div class="lock-screen">
      <h2 style="margin-bottom:8px;">Owner access</h2>
      <p class="muted-note" style="margin-bottom:16px;">Enter your PIN to manage products and view orders.</p>
      <input id="pinInput" maxlength="6" placeholder="PIN">
      <button class="btn-primary" id="unlockBtn">Unlock</button>
      <p class="muted-note">Default PIN is 1234 unless changed in Settings.</p>
    </div>`;
  }
  return `
    <div class="admin-tabs">
      <button class="admin-tab ${adminTab==='products'?'active':''}" data-atab="products">Products</button>
      <button class="admin-tab ${adminTab==='orders'?'active':''}" data-atab="orders">Orders ${orders.filter(o=>o.status==='pending').length ? `(${orders.filter(o=>o.status==='pending').length})` : ''}</button>
      <button class="admin-tab ${adminTab==='settings'?'active':''}" data-atab="settings">Settings</button>
    </div>
    ${adminTab==='products' ? renderAdminProducts() : adminTab==='orders' ? renderAdminOrders() : renderAdminSettings()}
  `;
}

function renderAdminProducts(){
  const rows = products.map(p=>`
    <div class="prod-row">
      <div class="prod-row-thumb">${p.image ? `<img src="${escapeAttr(p.image)}">` : (p.emoji||'🛒')}</div>
      <div class="prod-row-info">
        <div class="n">${escapeHtml(p.name)}</div>
        <div class="p">${escapeHtml(p.unit)} · ${money(p.price)} · ${escapeHtml(p.category)}</div>
      </div>
      <button class="icon-btn" data-photo="${p.id}">📷</button>
      <button class="icon-btn" data-edit="${p.id}">✏️</button>
      <button class="icon-btn" data-del="${p.id}">🗑️</button>
    </div>
  `).join('') || `<div class="empty">No products yet. Add your first one below.</div>`;

  return `
    <div class="admin-card">
      <h3 style="margin-bottom:12px;">Add a product</h3>
      <div class="field"><label>Item name</label><input id="pName" placeholder="e.g. Moong Dal"></div>
      <div class="row-2">
        <div class="field"><label>Price (₹)</label><input id="pPrice" type="number" placeholder="e.g. 110"></div>
        <div class="field"><label>Unit / pack size</label><input id="pUnit" placeholder="e.g. 1 kg"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Category</label><input id="pCat" placeholder="e.g. Pulses & Grains"></div>
        <div class="field"><label>Emoji icon</label><input id="pEmoji" placeholder="e.g. 🫘"></div>
      </div>
      <div class="field">
        <label>Photo — upload from your device</label>
        <input id="pImageFile" type="file" accept="image/*">
      </div>
      <div class="field"><label>...or paste an image URL instead</label><input id="pImage" placeholder="https://... (leave both blank to use emoji)"></div>
      <button class="small-btn" id="addProdBtn">+ Add product</button>
    </div>
    <h3 style="margin:16px 0 10px;">Current products (${products.length})</h3>
    ${rows}
  `;
}

function renderAdminOrders(){
  if(!orders.length) return `<div class="empty">No orders yet.</div>`;
  return orders.map(o=>`
    <div class="order-card">
      <div class="order-card-top">
        <div>
          <div style="font-weight:700; font-size:14px;">${o.id} · ${escapeHtml(o.name)}</div>
          <div class="muted-note">${escapeHtml(o.phone)} · ${o.time}</div>
        </div>
        <div class="order-status ${o.status==='done'?'done':''}">${o.status==='done'?'Fulfilled':'Pending'}</div>
      </div>
      <div class="order-items">${o.items.map(i=>`${i.qty}× ${escapeHtml(i.name)}`).join(', ')}</div>
      <div class="muted-note">📍 ${escapeHtml(o.addr)}${o.notes ? ' · '+escapeHtml(o.notes) : ''}</div>
      <div style="font-weight:700; margin-top:6px;">${money(o.total)}</div>
      <div class="order-actions">
        <button data-toggle="${o.id}">${o.status==='done' ? 'Mark pending' : 'Mark fulfilled'}</button>
        <button data-wa="${o.id}">Message customer</button>
      </div>
    </div>
  `).join('');
}

function renderAdminSettings(){
  const base = window.location.origin + window.location.pathname;
  const customerLink = base;
  const ownerLink = base + '?owner=1';
  return `
    <div class="admin-card">
      <h3 style="margin-bottom:12px;">Your two links</h3>
      <div class="field"><label>Send this to customers</label><input readonly value="${escapeAttr(customerLink)}" onclick="this.select()"></div>
      <div class="field"><label>Keep this one for yourself (bookmark it)</label><input readonly value="${escapeAttr(ownerLink)}" onclick="this.select()"></div>
      <p class="muted-note">The customer link never shows the Owner tab. Only your bookmarked link with <code>?owner=1</code> opens the owner area, and it still asks for your PIN.</p>
    </div>
    <div class="admin-card">
      <h3 style="margin-bottom:12px;">Store details</h3>
      <div class="field"><label>Store name</label><input id="sName" value="${escapeAttr(settings.storeName)}"></div>
      <div class="field"><label>Tagline</label><input id="sTag" value="${escapeAttr(settings.tagline)}"></div>
      <div class="field"><label>Your WhatsApp number (with country code, e.g. 91XXXXXXXXXX)</label><input id="sWA" value="${escapeAttr(settings.whatsapp)}" placeholder="91XXXXXXXXXX"></div>
      <div class="field"><label>Your UPI ID (e.g. yourname@okhdfcbank)</label><input id="sUPI" value="${escapeAttr(settings.upi)}" placeholder="name@bank"></div>
      <div class="field"><label>Payee display name for UPI</label><input id="sPayee" value="${escapeAttr(settings.payeeName)}"></div>
      <div class="field"><label>Owner PIN</label><input id="sPin" value="${escapeAttr(settings.pin)}" maxlength="6"></div>
      <button class="small-btn" id="saveSettingsBtn">Save settings</button>
      <p class="muted-note" style="margin-top:12px;">These details drive the "Pay via UPI" and "Message on WhatsApp" buttons customers see after ordering. No card or bank details are ever stored in this app.</p>
    </div>
  `;
}

function attachAdminEvents(){
  const unlockBtn = document.getElementById('unlockBtn');
  if(unlockBtn){
    unlockBtn.onclick = ()=>{
      const val = document.getElementById('pinInput').value.trim();
      if(val === (settings.pin||'1234')){ adminUnlocked = true; render(); }
      else showToast('Incorrect PIN');
    };
  }
  document.querySelectorAll('[data-atab]').forEach(el=>{
    el.onclick = ()=>{ adminTab = el.dataset.atab; render(); };
  });

  const addBtn = document.getElementById('addProdBtn');
  if(addBtn){
    addBtn.onclick = async ()=>{
      const name = document.getElementById('pName').value.trim();
      const price = parseFloat(document.getElementById('pPrice').value);
      const unit = document.getElementById('pUnit').value.trim() || '1 unit';
      const category = document.getElementById('pCat').value.trim() || 'Other';
      const emoji = document.getElementById('pEmoji').value.trim();
      const urlImage = document.getElementById('pImage').value.trim();
      const file = document.getElementById('pImageFile').files[0];
      if(!name || !price){ showToast('Enter a name and price'); return; }
      addBtn.disabled = true; addBtn.textContent = 'Adding…';
      let image = urlImage;
      try{
        if(file) image = await readAndResizeImage(file);
      }catch(e){ showToast('Could not read that photo, using default icon'); image=''; }
      products.push({ id:cryptoId(), name, price, unit, category, emoji, image });
      await sset('products', products);
      addBtn.disabled = false; addBtn.textContent = '+ Add product';
      showToast('Product added');
      render();
    };
  }

  document.querySelectorAll('[data-photo]').forEach(el=>{
    el.onclick = ()=>{
      hiddenPhotoInput.onchange = async ()=>{
        const file = hiddenPhotoInput.files[0];
        if(!file) return;
        try{
          const dataUrl = await readAndResizeImage(file);
          const p = products.find(x=>x.id===el.dataset.photo);
          p.image = dataUrl;
          await sset('products', products);
          showToast('Photo updated');
          render();
        }catch(e){ showToast('Could not read that photo'); }
      };
      hiddenPhotoInput.click();
    };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = async ()=>{
      products = products.filter(p=>p.id!==el.dataset.del);
      await sset('products', products);
      render();
    };
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = async ()=>{
      const p = products.find(x=>x.id===el.dataset.edit);
      if(!p) return;
      const newPrice = prompt(`New price for ${p.name} (₹)`, p.price);
      if(newPrice===null) return;
      const val = parseFloat(newPrice);
      if(!isNaN(val)){ p.price = val; await sset('products', products); render(); }
    };
  });

  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = async ()=>{
      const o = orders.find(x=>x.id===el.dataset.toggle);
      o.status = o.status==='done' ? 'pending' : 'done';
      await sset('orders', orders);
      render();
    };
  });
  document.querySelectorAll('[data-wa]').forEach(el=>{
    el.onclick = ()=>{
      const o = orders.find(x=>x.id===el.dataset.wa);
      const phone = o.phone.replace(/[^0-9]/g,'');
      window.open(`https://wa.me/${phone}`, '_blank');
    };
  });

  const saveBtn = document.getElementById('saveSettingsBtn');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      settings.storeName = document.getElementById('sName').value.trim() || settings.storeName;
      settings.tagline = document.getElementById('sTag').value.trim();
      settings.whatsapp = document.getElementById('sWA').value.trim();
      settings.upi = document.getElementById('sUPI').value.trim();
      settings.payeeName = document.getElementById('sPayee').value.trim() || settings.storeName;
      settings.pin = document.getElementById('sPin').value.trim() || '1234';
      await sset('settings', settings);
      document.getElementById('storeNameDisplay').textContent = settings.storeName;
      document.getElementById('storeTagDisplay').textContent = settings.tagline;
      showToast('Settings saved');
    };
  }
}

/* ---------------- Image handling ---------------- */
function readAndResizeImage(file, maxDim=640, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

/* ---------------- Utilities ---------------- */
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

init();
